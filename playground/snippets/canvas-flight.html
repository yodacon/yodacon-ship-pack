<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas 2D flight</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060b; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  p { position: fixed; left: 8px; bottom: 6px; margin: 0; color: #7ef0a8; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>Click, then ← → turn · ↑ thrust · ↓ brake</p>
<script type="module">
  import { loadShip, drawShip } from "./lib/yodacon-ship-pack.js";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize);
  resize();

  // Any ship of either edition: loadShip(edition, slug).
  const ship = await loadShip("override", "callisto");
  console.log(`Flying the ${ship.name}`, ship.meta.stats);

  const s = { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0, heading: 0 };
  const stars = Array.from({ length: 160 }, () => [Math.random() * 4000, Math.random() * 4000, Math.random()]);
  const mod = (n, m) => ((n % m) + m) % m;
  const keys = {};
  addEventListener("keydown", (e) => { keys[e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); });
  addEventListener("keyup", (e) => { keys[e.key] = false; });

  let last = performance.now();
  requestAnimationFrame(function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (keys.ArrowLeft) s.heading -= 180 * dt;
    if (keys.ArrowRight) s.heading += 180 * dt;
    s.heading = (s.heading + 360) % 360;
    const a = (Math.floor(s.heading / 10) * 10) * Math.PI / 180;   // thrust where the sprite points
    if (keys.ArrowUp) { s.vx += Math.sin(a) * 300 * dt; s.vy -= Math.cos(a) * 300 * dt; }
    if (keys.ArrowDown) { s.vx *= 0.95; s.vy *= 0.95; }
    s.x = (s.x + s.vx * dt + canvas.width) % canvas.width;
    s.y = (s.y + s.vy * dt + canvas.height) % canvas.height;

    ctx.fillStyle = "#05060b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const [x, y, z] of stars) {          // parallax stars: nearer ones (bigger z) drift more
      ctx.fillStyle = `rgba(200,210,255,${0.3 + z * 0.6})`;
      ctx.fillRect(mod(x - s.x * z * 0.3, canvas.width), mod(y - s.y * z * 0.3, canvas.height), 1, 1);
    }
    drawShip(ctx, ship, s.heading, s.x, s.y, 2);   // whole-number scale, nearest-neighbour
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
