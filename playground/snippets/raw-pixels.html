<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raw pixels</title>
<style>
  body { margin: 0; padding: 12px; background: #05060b; color: #cfd6ee; font: 14px/1.4 system-ui, sans-serif; }
  canvas { image-rendering: pixelated; width: 288px; max-width: 44vw; background: #0d1020; }
  label { display: inline-flex; gap: 8px; align-items: center; margin-right: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<p><label>hue <input id="hue" type="range" min="0" max="359" value="150"></label>
   <label>saturation × <input id="sat" type="range" min="0" max="200" value="100"></label></p>
<div class="row">
  <figure><canvas id="before"></canvas><figcaption>sheet-alpha.png as shipped</figcaption></figure>
  <figure><canvas id="after"></canvas><figcaption>re-coloured, pixel by pixel</figcaption></figure>
</div>
<script type="module">
  // It's just PNGs: draw one into a canvas, read the RGBA bytes, change them.
  const url = new URL("conex/ships/gryphon/sheet-alpha.png", document.baseURI).href;
  const img = new Image();
  img.crossOrigin = "anonymous";              // lets getImageData read a CDN-hosted image
  img.src = url;
  await img.decode();

  const before = document.getElementById("before"), after = document.getElementById("after");
  for (const c of [before, after]) { c.width = img.width; c.height = img.height; }
  before.getContext("2d").drawImage(img, 0, 0);
  const source = before.getContext("2d").getImageData(0, 0, img.width, img.height);
  console.log(`${img.width}×${img.height} px, ${source.data.length} bytes of RGBA`);

  // RGB ↔ HSL, the textbook way.
  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return [0, 0, l];
    const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  function hsl2rgb(h, s, l) {
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0) * 255, f(8) * 255, f(4) * 255];
  }

  function recolour() {
    const shift = Number(document.getElementById("hue").value);
    const satK = Number(document.getElementById("sat").value) / 100;
    const out = new ImageData(new Uint8ClampedArray(source.data), source.width, source.height);
    const p = out.data;
    for (let i = 0; i < p.length; i += 4) {
      if (p[i + 3] === 0) continue;             // transparent background: leave alone
      const [h, s, l] = rgb2hsl(p[i], p[i + 1], p[i + 2]);
      [p[i], p[i + 1], p[i + 2]] = hsl2rgb((h + shift) % 360, Math.min(1, s * satK), l);
    }
    after.getContext("2d").putImageData(out, 0, 0);
  }
  document.getElementById("hue").oninput = document.getElementById("sat").oninput = recolour;
  recolour();
</script>
</body>
</html>
